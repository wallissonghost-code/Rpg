<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>RPG Mobile Prototype</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="styles/hud.css"><link rel="stylesheet" href="styles/inventory.css"></head><body><main id="game"><canvas id="canvas"></canvas>
<div id="hud" class="hud-layer"><section class="player-status"><div class="player-avatar-slot" aria-hidden="true"></div><div class="player-vitals"><div class="player-meta"><span class="status-label">VIDA</span><b id="hpText">100/100</b></div><div class="bar"><span>HP</span><div><i id="hp"></i></div></div><div class="future-status-slots" hidden aria-hidden="true"></div></div></section></div>
<button id="inventoryOpen" class="inventory-open" aria-label="Abrir inventário"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 11V8.8C9 5.6 11.7 3 15 3h2c3.3 0 6 2.6 6 5.8V11"/><path d="M6.5 10.5h19l2 17h-23z"/><path d="M11 15v2m10-2v2"/></svg></button>
<section id="questPanel" class="quest-panel"><small>OBJETIVO</small><div id="message">Explore o mundo, encontre mobs e colete itens</div></section><section id="targetHud" class="target-hud" hidden aria-hidden="true"></section>
<div id="navigationHud"><div class="minimap-frame"><div class="region-slot" aria-hidden="true"></div><button id="minimap" aria-label="Abrir mapa"><canvas id="minimapCanvas" width="128" height="82"></canvas></button><div id="coordinates">X: 000 · Y: 000</div></div></div>
<button id="bagHold" hidden aria-label="Segure para abrir a sacola"><span id="bagHoldRing"></span><b class="bag-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 11V8.8C9 5.6 11.7 3 15 3h2c3.3 0 6 2.6 6 5.8V11"/><path d="M6.5 10.5h19l2 17h-23z"/></svg></b><small>SEGURE 3s</small></button><div id="joystick"><div id="stick"></div></div>
<div id="combatCluster"><div class="skill-slot skill-top" hidden></div><div class="skill-slot skill-left" hidden></div><div class="skill-slot skill-right" hidden></div><div class="skill-slot skill-far-left" hidden></div><div class="skill-slot skill-far-right" hidden></div><button id="attack" aria-label="Atacar"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 8l12 12-4 4L7 12z"/><path d="M37 8L25 20l4 4 12-12z"/><path d="M17 26l-8 8m22-8l8 8"/><path d="M6 32l10 10m26-10L32 42"/></svg></button></div>
<section id="inventoryPanel" class="inventory-panel" hidden><div class="inventory-window"><header class="inventory-head"><div><small>PERSONAGEM</small><h2>Inventário</h2></div><button id="inventoryClose" aria-label="Fechar inventário">✕</button></header><div class="inventory-body"><aside class="equipment-panel"><div class="equipment-layout"><button class="equip-slot equip-head" aria-label="Equipamento da cabeça"></button><button class="equip-slot equip-main" aria-label="Equipamento principal"></button><div class="character-preview" aria-label="Personagem"><div class="character-silhouette"><span></span></div></div><button class="equip-slot equip-off" aria-label="Equipamento secundário"></button><button class="equip-slot equip-feet" aria-label="Equipamento dos pés"></button><button class="equip-slot equip-extra" aria-label="Acessório"></button></div></aside><section class="inventory-storage"><div class="storage-head"><span>MOCHILA</span><small><b id="inventoryCount">0</b> / 40</small></div><div id="inventoryGrid" class="inventory-grid"></div><div class="inventory-wallet"><span>MOEDAS</span><b id="coins">0</b></div></section></div></div></section>
<section id="deathBag" hidden><div class="bag-panel"><div class="bag-head"><div><small>ITENS PERDIDOS</small><h2>Sua sacola</h2></div><button id="bagClose">✕</button></div><p>Selecione o que deseja recuperar.</p><div id="bagItems"></div></div></section>
<section id="worldMap" hidden><div class="world-map-panel"><div class="world-map-head"><div><small>MAPA DO MUNDO</small><h2>Exploração</h2></div><button id="worldMapClose" aria-label="Fechar mapa">✕</button></div><canvas id="worldMapCanvas"></canvas><div class="map-legend"><span><i></i> Você</span><span class="legend-mob">● Mob próximo</span><span class="legend-bag">● Sacola</span><small>Toque no mapa para marcar um destino.</small></div></div></section>
</main><script type="module" src="src/main.js"></script></body></html>
