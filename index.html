<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>RPG Mobile Prototype</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><canvas id="canvas"></canvas><div id="hud"><div class="bar"><span>HP</span><div><i id="hp"></i></div><b id="hpText">100/100</b></div><div id="stats">⚔️ 20 &nbsp; 💰 <b id="coins">0</b> &nbsp; 🎒 <b id="drops">0</b></div></div><div id="navigationHud"><button id="minimap" aria-label="Abrir mapa"><canvas id="minimapCanvas" width="128" height="82"></canvas></button><div id="coordinates">X: 000  Y: 000</div></div><button id="bagHold" hidden aria-label="Segure para abrir a sacola"><span id="bagHoldRing"></span><b>🎒</b><small>SEGURE 3s</small></button><div id="message">Explore o mundo, encontre mobs e colete itens</div><div id="joystick"><div id="stick"></div></div><button id="attack" aria-label="Atacar">⚔️</button><section id="deathBag" hidden><div class="bag-panel"><div class="bag-head"><div><small>ITENS PERDIDOS</small><h2>🎒 Sua sacola</h2></div><button id="bagClose">✕</button></div><p>Selecione o que deseja recuperar.</p><div id="bagItems"></div></div></section><section id="worldMap" hidden><div class="world-map-panel"><div class="world-map-head"><div><small>MAPA DO MUNDO</small><h2>Exploração</h2></div><button id="worldMapClose" aria-label="Fechar mapa">✕</button></div><canvas id="worldMapCanvas"></canvas><div class="map-legend"><span><i></i> Você</span><span class="legend-mob">● Mob próximo</span><span class="legend-bag">● Sacola</span><small>Toque no mapa para marcar um destino.</small></div></div></section></main><script type="module" src="src/main.js"></script></body></html>
