<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>RPG Mobile Prototype</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="styles/hud.css"></head><body><main id="game"><canvas id="canvas"></canvas>
<div id="hud" class="hud-layer">
 <section class="player-status"><div class="player-avatar-slot" aria-hidden="true"></div><div class="player-vitals"><div class="player-meta"><span class="status-label">VIDA</span><b id="hpText">100/100</b></div><div class="bar"><span>HP</span><div><i id="hp"></i></div></div><div class="future-status-slots" hidden aria-hidden="true"></div></div></section>
 <section class="utility-cluster" aria-label="Recursos"><div class="resource-chip weapon-chip" aria-label="Dano">⚔️ <b>20</b></div><div class="resource-chip">🪙 <b id="coins">0</b></div><div class="resource-chip backpack-chip" aria-label="Itens coletados">🎒 <b id="drops">0</b></div></section>
</div>
<section id="questPanel" class="quest-panel"><small>OBJETIVO</small><div id="message">Explore o mundo, encontre mobs e colete itens</div></section>
<section id="targetHud" class="target-hud" hidden aria-hidden="true"></section>
<div id="navigationHud"><div class="minimap-frame"><div class="region-slot" aria-hidden="true"></div><button id="minimap" aria-label="Abrir mapa"><canvas id="minimapCanvas" width="128" height="82"></canvas></button><div id="coordinates">X: 000 · Y: 000</div></div></div>
<button id="bagHold" hidden aria-label="Segure para abrir a sacola"><span id="bagHoldRing"></span><b>🎒</b><small>SEGURE 3s</small></button>
<div id="joystick"><div id="stick"></div></div>
<div id="combatCluster"><div class="skill-slot skill-top" hidden></div><div class="skill-slot skill-left" hidden></div><div class="skill-slot skill-right" hidden></div><div class="skill-slot skill-far-left" hidden></div><div class="skill-slot skill-far-right" hidden></div><button id="attack" aria-label="Atacar">⚔️</button></div>
<section id="deathBag" hidden><div class="bag-panel"><div class="bag-head"><div><small>ITENS PERDIDOS</small><h2>🎒 Sua sacola</h2></div><button id="bagClose">✕</button></div><p>Selecione o que deseja recuperar.</p><div id="bagItems"></div></div></section>
<section id="worldMap" hidden><div class="world-map-panel"><div class="world-map-head"><div><small>MAPA DO MUNDO</small><h2>Exploração</h2></div><button id="worldMapClose" aria-label="Fechar mapa">✕</button></div><canvas id="worldMapCanvas"></canvas><div class="map-legend"><span><i></i> Você</span><span class="legend-mob">● Mob próximo</span><span class="legend-bag">● Sacola</span><small>Toque no mapa para marcar um destino.</small></div></div></section>
</main><script type="module" src="src/main.js"></script></body></html>
